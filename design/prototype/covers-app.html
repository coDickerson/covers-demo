<style>
:root { --ink:#141414; --ink2:#4A4744; --mute:#7A7672; --line:#E2DED9; --paper:#FBFAF8; --white:#fff; --over:#D93A26; --ok:#2B7A4B; --near:#A86A00; --volt:#E4F222; --band:#F1EFEA; --ease:cubic-bezier(.2,0,0,1); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: var(--paper); }

#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; background: var(--paper); overflow: hidden; }

#bar { position: absolute; left: 40px; right: 40px; height: 52px; display: flex; align-items: center; gap: 28px; padding: 0 8px 0 28px; background: var(--white); border-radius: 999px; box-shadow: 0 2px 14px rgba(20,20,20,.1); z-index: 5; }
#bar { top: 12px; border: 1px solid var(--line); }

#bar .sp { order: 0; }
#bar .role:hover { color: var(--ink); }

#main { position: absolute; left: 0; right: 0; height: 828px; }
#main { top: 72px; } #page { position: absolute; inset: 0; overflow-y: auto; padding: 14px 40px 12px; transition: opacity 180ms var(--ease); }
[hidden] { display: none !important; }

.filters { display: flex; align-items: baseline; gap: 46px; }

.grid { display: grid; grid-template-columns: 372px repeat(7, 96px) 1fr; align-items: center; column-gap: 0; }
.head { margin-top: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font-size: 14px; color: var(--mute); font-weight: 600; }
.head span { text-align: center; }

.head span:last-child { padding-left: 34px; }
.dsec { font-size: 14px; font-weight: 700; padding: 12px 0 3px; }
.dsec.need { color: var(--over); }
.row { width: 100%; height: 48px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--white); }
.what { min-width: 0; padding-left: 6px; }

.cell { position: relative; height: 48px; display: flex; align-items: center; justify-content: center; }

.cell.pl::before, .cell.pr::after { background: var(--ink); }
.dot { position: relative; z-index: 1; width: 11px; height: 11px; margin-top: 12px; background: var(--paper); border: 1px solid var(--line); }
.row:hover .dot { background: var(--white); }
.dot.d, .row:hover .dot.d { background: var(--ink); border-color: var(--ink); }
.bell { position: relative; z-index: 1; width: 24px; margin-top: -4px; }
.bell svg { display: block; width: 24px; shape-rendering: crispEdges; }
.bell i { position: absolute; left: 19px; top: -7px; width: 15px; height: 15px; background: var(--over); color: #fff; font: 700 11px/15px 'Inter Tight'; font-style: normal; text-align: center; }
.head { position: sticky; top: -14px; background: var(--paper); z-index: 3; padding-top: 8px; }
.both .row > .cell:nth-child(odd), .bands .row > .cell:nth-child(odd), .both .head > span:nth-child(odd):not(:first-child):not(:last-child), .bands .head > span:nth-child(odd):not(:first-child):not(:last-child) { background: var(--band); }
.head > span { padding-block: 4px; }

.both .bell small, .names .bell small { display: block; }
.say { padding-left: 34px; font-size: 16px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say.over { color: var(--over); font-weight: 600; } .say.near { color: var(--near); font-weight: 600; } .say.ok { color: var(--ok); }

.donebar:hover { background: var(--white); color: var(--ink); }
.more { padding: 12px 6px; font-size: 15px; color: var(--mute); }

.stub { padding-top: 220px; text-align: center; }
.stub h1 { font-size: 40px; letter-spacing: -.03em; }
.stub p { margin-top: 8px; color: var(--ink2); font-size: 19px; }
#mockctl { position: absolute; right: 18px; z-index: 6; display: flex; gap: 10px; align-items: center; padding: 7px 11px; background: var(--white); border: 1px dashed var(--mute); font-size: 14px; color: var(--mute); }
#mockctl { bottom: 16px; } #mockctl button { font-weight: 500; color: var(--mute); }
#mockctl button.on { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

:root { --ink:#141414; --ink2:#4A4744; --mute:#7A7672; --line:#E2DED9; --paper:#FBFAF8; --white:#fff; --over:#D93A26; --ok:#2B7A4B; --near:#A86A00; --volt:#E4F222; --tint:#F6FAB4; --ease:cubic-bezier(.2,0,0,1); }

 { Speaker: NOTE('Anything to add about this speaker?'), Identity: CHECK('Confirm', ['These are the people I invited']), 'Meal limit': NOTE('Why is this estimate right?'), 'Annual limit': CHECK('If this total looks wrong', ['Ask compliance to review the ledger', 'A past dinner is missing or doubled']), 'Red flags': NOTE('Why does this guest need to attend again?'), Reporting: NOTE('Anything to remember for reporting?') },

/* ---------- dashboard ---------- */

document.addEventListener('click', e => {
